name: Update 3D contributions

on:
  workflow_dispatch:
  schedule:
    # 06:23 Asia/Shanghai (22:23 UTC the previous day).
    - cron: '23 22 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Verify renderer
        run: python3 -m unittest discover -s tests -v

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -F query=@scripts/contributions.graphql \
            -f login="$PROFILE_LOGIN" \
            > "$RUNNER_TEMP/contributions.json"

      - name: Render both themes
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/render_contributions.py \
            --input "$RUNNER_TEMP/contributions.json" \
            --output-dir assets \
            --login "$PROFILE_LOGIN"

      - name: Publish updated charts
        run: |
          git add assets/contribution-3d-light.svg assets/contribution-3d-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution charts are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh 3D contribution charts'
          git pull --rebase origin main
          git push origin HEAD:main
